global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'nexvion-app'
    static_configs:
      - targets: ['localhost:8080']
EOF

cat << 'EOF' > monitoring/grafana/dashboards.yaml
apiVersion: 1
providers:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards