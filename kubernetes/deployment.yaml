apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexvion-deployment
  namespace: default
  labels:
    app: nexvion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexvion
  template:
    metadata:
      labels:
        app: nexvion
    spec:
      containers:
      - name: nexvion
        image: nexvion-ecommerce:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nexvion-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: nexvion
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
